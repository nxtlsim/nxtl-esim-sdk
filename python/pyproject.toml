[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxtl-esim"
version = "0.1.0"
description = "Python SDK for the NXTL eSIM B2B API. Issue, resell and manage pay-as-you-go travel eSIMs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NXTL eSIM", email = "support@nxtlsim.com" }]
keywords = ["nxtl", "esim", "pay-as-you-go", "reseller", "b2b"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://nxtlsim.com"
Documentation = "https://nxtlsim.com/nxtl-api-reference/"
Business = "https://nxtlsim.com/for-business/"
Source = "https://github.com/nxtlsim/nxtl-esim-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nxtl_esim = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/nxtl_esim/endpoints.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
